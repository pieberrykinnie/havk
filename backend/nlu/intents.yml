# Intent patterns (simple regex list per intent)
# Case-insensitive flags expected to be added by parser
join:
  - "\\bjoin\\b"
  - "\\bstart\\b"
  - "\\bregister\\b"
  - "\\bunete\\b"   # Spanish
  - "\\biniciar\\b" # Spanish
  - "\\bshamil\\b" # Hindi transliteration (शामिल)
  - "\\bshuru\\b"  # Hindi transliteration (शुरू)

leave:
  - "\\bleave\\b"
  - "\\bquit\\b"
  - "\\bexit\\b"

done:
  - "\\bdone\\b"
  - "\\bstop\\b"
  - "\\bcomplete\\b"
  - "\\bhecho\\b"   # Spanish
  - "\\bcompleto\\b" # Spanish
  - "\\bkhatam\\b" # Hindi (ख़त्म)
  - "\\bpoora\\b"  # Hindi (पूरा)