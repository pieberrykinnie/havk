name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r production_ready_code/backend/requirements.txt
      - name: Run backend tests
        run: pytest production_ready_code/backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd production_ready_code/frontend
          npm ci
      - name: Run frontend tests
        run: |
          cd production_ready_code/frontend
          npm test -- --watchAll=false