version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: havk_db
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./production_ready_code/backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./production_ready_code/backend:/code
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: db
      POSTGRES_DB: havk_db
      POSTGRES_PORT: 5432
      SECRET_KEY: CHANGE_ME_SUPER_SECRET
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./production_ready_code/frontend
      dockerfile: Dockerfile
    command: npm run dev
    volumes:
      - ./production_ready_code/frontend:/app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db-data: