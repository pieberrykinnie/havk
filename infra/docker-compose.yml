version: "3.9"

services:
  api:
    # Placeholder container; actual image built when backend service ready
    image: python:3.12-slim
    command: ["sleep", "infinity"]
    volumes:
      - ../backend:/app:ro
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - supabase-db
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  supabase-db:
    # Lightweight Postgres image; Supabase-compatible for local dev
    image: supabase/postgres:15-14.0
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: example

volumes:
  supabase-data: